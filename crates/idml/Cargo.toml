[package]
name = "idml"
version = "0.1.0"
description = "Version-neutral, lossless IDML reading, authoring and writing with generated schema profiles and typed views"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[package.metadata.idml]
# The package schemas the model in src/model/ is generated from.
schema = "../../schemas/21.5.0.64/package"
# Every <build>/package (or <build>/single) below it dates the schema items.
history = "../../schemas"
# How documents of older versions are read: a rule for every item they differ in.
upgrades = "schema-upgrades.tsv"

[features]
default = []
# An adapter into the single schema configured above, separate from universal Package.
owned = []

[dependencies]
miniz_oxide = { workspace = true }
roxmltree = { workspace = true }
quick-xml = { workspace = true }

[dev-dependencies]
idml-codegen = { workspace = true }
zip = { workspace = true }

[lints]
workspace = true
